# Keeps the pinned workflow actions and npm packages current: Dependabot opens
# a pull request once a month, and the deploy workflow runs the tests on it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']

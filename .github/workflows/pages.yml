# Active once this folder is the root of its own repository
# (see scripts/export-site.sh in the main project).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      - run: npm test

      - name: Build
        run: npm run build
        env:
          # "" with a custom domain, "/<repo>" for <user>.github.io/<repo>.
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          # Public by design — the database only exposes three guarded functions.
          # Set both under Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # Asks the real project for a puzzle: proves URL, key and schema.sql are
      # all in place before anything is published.
      - name: Refuse to publish a site that cannot store sign-ups
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Repository variables VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are missing."
            exit 1
          fi
          if ! printf '%s' "$SUPABASE_URL" | grep -Eq '^https://[a-z0-9-]+(\.[a-z0-9-]+)+/?$'; then
            echo "::error::VITE_SUPABASE_URL must look like https://<project-ref>.supabase.co (got: $SUPABASE_URL)."
            exit 1
          fi
          status=$(curl --silent --output body.json --write-out '%{http_code}' --max-time 20 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/get_challenge" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}' || true)
          case "$status" in
            200) grep -q '"challenge"' body.json && exit 0
                 echo "::error::Supabase answered, but not with a puzzle. Run supabase/schema.sql again." ;;
            401|403) echo "::error::Supabase rejected VITE_SUPABASE_ANON_KEY. Copy the publishable (or anon) key again." ;;
            404) echo "::error::Function get_challenge not found. Run supabase/schema.sql in the Supabase SQL editor." ;;
            000) echo "::error::Could not reach $SUPABASE_URL. Check VITE_SUPABASE_URL." ;;
            *) echo "::error::Unexpected answer from Supabase (HTTP $status)."; cat body.json ;;
          esac
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
